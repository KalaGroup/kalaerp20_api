<div class="card">
  <h3 class="card-header text-center font-weight-bold text-uppercase py-4">Purchase Requisition</h3>
  <div class="card-body">
    <div fxLayout="100" class="row" style="align-items:center;padding-left:15px">
      <div class="col-lg-3">
        <mat-form-field>
          <label>Requisition No</label>
          <input matInput class="controlClass">
        </mat-form-field>
      </div>
      <div class="col-lg-3">
        <mat-form-field>
          <label>Class Code</label>
          <input matInput value="03" disabled="true" class="controlClass">
        </mat-form-field>
      </div>
      <div class="col-lg-3">
        <mat-form-field>
          <label>Class Name</label>
          <input matInput value="C Class" disabled="true" class="controlClass">
        </mat-form-field>
      </div>
      <div class="col-lg-3">
        <mat-form-field>
          <label>For PC Name</label>
          <mat-select class="controlClass">
            <mat-option matInput *ngFor="let pcname of purchaseReqPCName" [value]="pcname.PCCode">
              {{pcname.PCName}}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-lg-3" style="padding-left: 30px;">
        <form class="example-form">
          <mat-form-field class="example-full-width">
            <input type="text" aria-label="Number" class="controlClass" matInput [formControl]="myControl"
              style="width: 300px;" [matAutocomplete]="auto">
            <mat-autocomplete autoActiveFirstOption #auto="matAutocomplete">
              <mat-option *ngFor="let option of filteredOptions" [value]="option.PartCode">
                {{option.PartDesc}}
              </mat-option>
            </mat-autocomplete>
          </mat-form-field>
        </form>
      </div>
      <div class="col-lg-3" style="align-items: center;">

        <button type="button" (click)="openDialog()" style="margin-top: 21px;">Add</button>
      </div>
    </div>
    <div style="width:100%;">
      <table mat-table [dataSource]="purchaseReqList.supplier" class="mat-elevation-z8" style="width: 100%">

        <!--- Note that these columns can be defined in any order.
        The actual rendered columns are set as a property on the row definition" -->
        <!-- Position Column -->
        <ng-container matColumnDef="Sr.No">
          <th mat-header-cell *matHeaderCellDef>sr.no</th>
          <td mat-cell *matCellDef="let element"> {{element.position}} </td>
        </ng-container>
        <ng-container matColumnDef="PartDescription">
          <th mat-header-cell *matHeaderCellDef>Part Desc</th>
          <td mat-cell *matCellDef="let element"> {{purchaseReqList.part_description}} </td>
        </ng-container>
        <ng-container matColumnDef="SuppName">
          <th mat-header-cell *matHeaderCellDef>Supp Name</th>
          <td mat-cell *matCellDef="let element" style="font-weight: bolder;" (click)="openSupplierDetailsDialog()">{{element.supplier_name}}</td>
        </ng-container>
        <!-- Name Column -->
        <ng-container matColumnDef="UOM">
          <th mat-header-cell *matHeaderCellDef> UOM</th>
          <td mat-cell *matCellDef="let element"> {{"Nos"}} </td>
        </ng-container>

        <!-- Weight Column -->
        <ng-container matColumnDef="RequiredQty">
          <th mat-header-cell *matHeaderCellDef> Required Qty </th>
          <td mat-cell *matCellDef="let element"> {{"50"}} </td>
        </ng-container>

        <ng-container matColumnDef="Action">
          <th mat-header-cell *matHeaderCellDef> Action </th>
          <td mat-cell *matCellDef="let element; let i = index;"> <button type="button" mdbBtn color="danger"
              rounded="true" size="sm" class="my-0" (click)="remove(i)">Remove</button> </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </div>
</div>
